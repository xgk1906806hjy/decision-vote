server:
  port: 8080

spring:
  application:
    name: decision-vote
  datasource:
    url: jdbc:mysql://localhost:3306/decision_vote?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: ${JWT_SECRET:lukou-decision-vote-please-change-this-secret-in-production-2026}
    expire-hours: 720
  wx:
    app-id: ${WX_APPID:}
    app-secret: ${WX_SECRET:}
    # mock=true 时不需要真实 AppID，用 code 直接生成测试 openid，方便本地联调
    mock: ${WX_MOCK:true}
  content:
    # 内容安全检查：mock=true 时只做本地关键词过滤，不调用微信接口
    audit-mock: ${AUDIT_MOCK:true}
  post:
    # 过期决策状态落库：默认每分钟扫一次，首次延迟 5 秒
    close-interval-ms: ${POST_CLOSE_INTERVAL_MS:60000}
    close-initial-delay-ms: ${POST_CLOSE_INITIAL_DELAY_MS:5000}

logging:
  level:
    com.lukou.decision: info
