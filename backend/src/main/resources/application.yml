server:
  port: 8080

spring:
  application:
    name: decision-vote
  datasource:
    url: jdbc:mysql://localhost:3306/decision_vote?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      # 头像上传：单文件 2MB，请求体留一点余量
      max-file-size: 2MB
      max-request-size: 3MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  jwt:
    secret: ${JWT_SECRET:lukou-decision-vote-please-change-this-secret-in-production-2026}
    expire-hours: 720
  wx:
    app-id: ${WX_APPID:}
    app-secret: ${WX_SECRET:}
    # mock=true 时不需要真实 AppID，用 code 直接生成测试 openid，方便本地联调
    mock: ${WX_MOCK:true}
  content:
    # 内容安全检查：mock=true 时只做本地关键词过滤，不调用微信接口
    audit-mock: ${AUDIT_MOCK:true}
    # msgSecCheck 场景：1 资料 / 2 评论 / 3 论坛 / 4 社交日志
    scene: ${CONTENT_SCENE:3}
    # 微信接口故障时是否放行；默认 false，避免绕过审核
    fail-open: ${CONTENT_FAIL_OPEN:false}
  post:
    # 过期决策状态落库：默认每分钟扫一次，首次延迟 5 秒
    close-interval-ms: ${POST_CLOSE_INTERVAL_MS:60000}
    close-initial-delay-ms: ${POST_CLOSE_INITIAL_DELAY_MS:5000}
  admin:
    # 举报后台令牌，请求头 X-Admin-Token；生产必须用 ADMIN_TOKEN 覆盖
    token: ${ADMIN_TOKEN:change-me-in-production}
  subscribe:
    # 回访提醒模板 ID；留空 = 未接入，定时任务只跳过不报错
    follow-up-template-id: ${FOLLOW_UP_TMPL_ID:}
    follow-up-page: ${FOLLOW_UP_PAGE:/pages/detail/detail?id={postId}}
    # 每天 10:00 发一轮（服务器时区）
    cron: ${FOLLOW_UP_CRON:0 0 10 * * ?}
    # 只提醒最近 N 天内到期的决策，避免翻旧账
    max-age-days: ${FOLLOW_UP_MAX_AGE_DAYS:7}
    batch-size: ${FOLLOW_UP_BATCH_SIZE:50}
    # 单用户最多囤积的提醒次数
    max-remain: ${FOLLOW_UP_MAX_REMAIN:10}
    # true 时只打印日志不真发，联调用
    dry-run: ${FOLLOW_UP_DRY_RUN:false}
  upload:
    # 头像落盘目录，相对路径按进程工作目录解析
    dir: ${UPLOAD_DIR:./uploads}
    # 对外前缀；留空返回 /uploads/... 相对路径，配了域名/CDN 则拼在前面
    public-base: ${UPLOAD_PUBLIC_BASE:}
    avatar-max-mb: ${UPLOAD_AVATAR_MAX_MB:2}

logging:
  level:
    com.lukou.decision: info
